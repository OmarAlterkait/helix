# SLAC S3DF -- the machine helix was developed on.
#
# These values were the DEFAULTS baked into helix/paths.py until site profiles
# existed. That is why they are reproduced here verbatim rather than tidied: this
# file is a faithful record of what the code used to assume, so that moving to
# profiles changes WHERE the values live and not WHAT they are. Anything that
# looks wrong here was wrong before.
name: s3df

# How this profile is recognised when HELIX_SITE is unset. `path` matches if the
# directory exists; S3DF is the only site with /sdf mounted.
detect:
  path: /sdf

roots:
  HELIX_CORPUS_ROOT:   /sdf/data/neutrino/omara
  HELIX_CORPUS:        /sdf/data/neutrino/omara/coeff_tpc_d1m/j000000
  # One filesystem here, so there is no staged/durable split to record.
  HELIX_CORPUS_DURABLE: null
  # The JAXTPC wire stage of the 1M-event campaign: <group>/<task>/{sensor,step,hits,labl}/
  # (helix/tpc/io.py, helix/data/cells.py). sensor / step / hits link to doraemon's
  # /sdf/data/neutrino/doraemon/doraemon_2026_1M_lartpc/data/jaxtpc_wire; labl is
  # pimm-data's supera_labl of the campaign's supera_wire stage, written here. doraemon
  # belongs to a DIFFERENT group. A handover target will not have read access, so
  # neither the corpus nor its truth (read by scripts/build_truth.py) can be rebuilt
  # from there (INVENTORY.md, at git tag archive-2026-11).
  HELIX_SIM_ROOT:      /sdf/data/neutrino/omara/doraemon_2026_1M_lartpc/data/jaxtpc_wire
  HELIX_ARCHIVE:       /sdf/data/neutrino/omara/archive
  HELIX_EXP:           /sdf/data/neutrino/omara/exp/helix
  HELIX_SCRATCH:       $SCRATCH
  HELIX_PIMM_ROOT:     /sdf/group/neutrino/omara/pimm-fm
  HELIX_PIMM_DATA_SRC: /sdf/group/neutrino/omara/pimm-data/src
  HELIX_JAXTPC_ROOT:   /sdf/group/neutrino/omara/JAXTPC
  # Another user's home directory. Out of scope for the wire FM.
  HELIX_OPTICAL_DATA:  /sdf/home/y/youngsam/sw/dune/sim/goop/data/light_output.h5

# The container, as four facts rather than one path. `HELIX_IMAGE` used to be a
# single root typed as a filesystem path to a .sif, which cannot describe a site
# whose image is a registry reference -- see nersc.yaml.
container:
  runtime: apptainer
  image: /sdf/data/neutrino/omara/images/helix-train.sif
  # The interpreter INSIDE the image. Not a host path.
  python: /opt/pimm/.venv/bin/python
  # -B targets. /lscratch is node-local; /sdf carries every root above.
  binds: [/sdf, /lscratch]

# Scheduler facts, split by job KIND because they genuinely differ here.
scheduler:
  train:
    # `neutrino:default@ampere` carries ONLY the preemptable QOS, and preemption
    # at S3DF CANCELS rather than requeues, so a job longer than the preemption
    # window cannot finish on it. See TODO.md.
    account: mli:cider-ml
    partition: ampere
    qos: normal
    gpus_flag: gpus
  # One-GPU jobs after training (scripts/sweep.py's after_each / after_all): helix.eval needs an
  # A100 (varlen attention, sm80+), ~32 cores and ~25 GB of host memory at FIT_ROWS = 1M.
  eval:
    account: mli:cider-ml
    partition: ampere
    qos: normal
    gpus: 1
    cpus_per_task: 32
    mem: 64G
  corpus:
    # A DIFFERENT account: authorisation is per partition, and mli:cider-ml does
    # not cover turing while mli:default does. The DSP is architecture-sensitive
    # (turing and A100 disagree on 0.016% of surviving coefficients), so the
    # corpus is built on turing only -- see docs/DECISIONS.md.
    account: mli:default
    partition: turing
    qos: preemptable
    gpus_flag: gpus
    # preempted tasks are requeued (a requeued build task skips its finished shards); these turing
    # nodes fail jobs
    extra: --requeue --exclude=sdfturing017,sdfturing027,sdfturing020,sdfturing021,sdfturing019,sdfturing006
