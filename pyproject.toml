[project]
name = "helix-tpc"
# Read from helix/__init__.py rather than duplicated here. These two drifted
# (0.1.0 vs 0.2.0) and it was not cosmetic: helix/core/coeff_io.py stamps
# helix.__version__ into every corpus shard, and pimm_data/coeff_verify.py
# raises "shards were built by DIFFERENT helix versions" off that field — so the
# provenance chain read a number the packaging disagreed with. The module stays
# the source of truth because helix must import from a plain checkout on
# PYTHONPATH, where importlib.metadata has nothing to read.
dynamic = ["version"]
description = "Hierarchical Encoding for Learned Inference on eXperimental data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "PyWavelets>=1.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Stage-1 probe truth reads the doraemon hits/step shards, which are written
# with a compression plugin. Without this h5py raises "can't open directory
# /usr/local/hdf5/lib/plugin" on read — it worked in one container by accident.
# (hdf5plugin's actual importers are helix/tpc/io.py, guarded, and
# scripts/dump_probe_truth.py — not helix/probe/ itself.)
#
# torch is here because helix/probe/{features,fit}.py import it at module scope:
# without it `pip install helix-tpc[probe]` produced an environment in which
# helix.probe.fit could not run at all.
probe = ["hdf5plugin>=4.0", "torch>=2.0"]

# Lazy imports that raise a clear error when absent, so they are opt-in rather
# than base dependencies — but they were declared NOWHERE, which made them
# undiscoverable. helix/model/checkpoint.py needs safetensors to read a
# .safetensors export (it SystemExits telling you to install it);
# helix/optical/viz.py needs matplotlib for plot_decomposition.
export = ["safetensors>=0.4"]
viz = ["matplotlib>=3.6"]

# helix.data and helix.integrations are the ONLY subpackages that may import
# pimm_data (7 modules do). helix.core and helix.tpc must never touch it, and
# tests/test_boundary.py enforces that by importing each in a clean subprocess.
#
# That asymmetry is why this is an extra and not a dependency: pimm-data
# requires torch>=2.5 and hdf5plugin UNCONDITIONALLY, while helix's base install
# is numpy/h5py/PyWavelets/scipy and torch is optional. Making pimm-data a hard
# dependency would drag torch into every DSP-only install — including the
# corpus-builder container, which deliberately has pywt and torch but NO
# pimm-data, while the training container has pimm-data but NO pywt.
#
# pimm-data is not on PyPI. It resolves from whatever git source or editable
# checkout the consumer configures (see pimm-fm's uv.lock, or
# `pip install -e ../pimm-data`), so no URL is pinned here — a URL in this file
# would be a second place to get the revision wrong.
# NOTE this covers the DATA layer only. helix/integrations/pimm/* also imports
# the `pimm` training framework itself (7 modules do), which is not declared
# here because it is not on PyPI either and its version is pinned by pimm-fm's
# uv.lock, not by helix. Installing this extra does NOT give you a working
# training integration; use the container (docs/ARCHITECTURE.md section 4).
pimm = ["pimm-data>=0.4.0"]

# Backend frameworks are optional: helix.core imports only the selected one
# lazily. NumPy (base dep) is always available; add jax and/or torch as needed.
jax-cpu = ["jax[cpu]>=0.4.20"]
jax-gpu = ["jax[cuda12]>=0.4.20"]
torch-cpu = ["torch>=2.0"]          # CPU wheels: pip install --index-url https://download.pytorch.org/whl/cpu
cpu = ["jax[cpu]>=0.4.20", "torch>=2.0"]
gpu = ["jax[cuda12]>=0.4.20", "torch>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
]

[project.scripts]
helix = "helix.tpc.run:main"
helix-tpc = "helix.tpc.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", ".git", "*.egg-info"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "helix.__version__"}

[tool.setuptools.packages.find]
include = ["helix*"]

# The detector description and the measured noise spectrum are DATA the code
# loads by default — helix.tpc.geometry.load_plane_registry and
# helix.tpc.noise.load_series_spectrum (the latter is the DEFAULT series
# spectrum). Without this they are absent from a built wheel and both raise
# FileNotFoundError, which an editable install hides completely.
[tool.setuptools.package-data]
"helix.tpc" = ["data/*.json", "data/*.npz"]
