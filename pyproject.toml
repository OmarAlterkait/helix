[project]
name = "helix-tpc"
# Read from helix/__init__.py rather than duplicated here. These two drifted
# (0.1.0 vs 0.2.0) and it was not cosmetic: helix/core/coeff_io.py stamps
# helix.__version__ into every corpus shard, and pimm_data/coeff_verify.py
# raises "shards were built by DIFFERENT helix versions" off that field — so the
# provenance chain read a number the packaging disagreed with. The module stays
# the source of truth because helix must import from a plain checkout on
# PYTHONPATH, where importlib.metadata has nothing to read.
dynamic = ["version"]
description = "Hierarchical Encoding for Learned Inference on eXperimental data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "PyWavelets>=1.4",
    "scipy>=1.10",
    # helix/paths.py reads helix/sites/*.yaml. Pure-python and tiny; the lean
    # install exists to keep torch/pimm-data OUT (tests/test_boundary.py), not
    # to keep the dependency count at zero.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# torch is optional at install: the DSP (helix.core.wavelet, the TPC chain, the optical codec)
# and the model import it when they run, never at `import helix`. CPU wheels:
# pip install --index-url https://download.pytorch.org/whl/cpu
torch = ["torch>=2.0"]

# The truth step (scripts/build_truth.py, helix.data.cells) reads the doraemon hits/step
# shards, which are written with a compression plugin. Without this h5py raises
# "can't open directory /usr/local/hdf5/lib/plugin" on read. torch: helix.eval's probes.
probe = ["hdf5plugin>=4.0", "torch>=2.0"]

# helix.data and helix.integrations are the ONLY subpackages that may import
# pimm_data. helix.core and helix.tpc must never touch it (tests/test_boundary.py).
#
# That asymmetry is why this is an extra and not a dependency: pimm-data
# requires torch>=2.5 and hdf5plugin UNCONDITIONALLY, while helix's base install
# is numpy/h5py/PyWavelets/scipy/PyYAML and torch is optional.
#
# pimm-data is not on PyPI; [tool.uv.sources] below pins its revision, and that
# line is the only place the revision is named (tests/test_lockstep_pin.py).
# NOTE this covers the DATA layer only. helix/integrations/pimm/* also imports
# the `pimm` training framework itself, which is not declared here because it is
# not on PyPI either; installing this extra does NOT give you a working training
# integration. Use the container (docs/ARCHITECTURE.md section 10).
pimm = ["pimm-data>=0.4.0"]

dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", ".git", "*.egg-info"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "helix.__version__"}

[tool.setuptools.packages.find]
include = ["helix*"]

# The detector description and the measured noise spectrum are DATA the code
# loads by default — helix.tpc.readout.load_plane_registry and
# helix.tpc.noise.load_series_spectrum (the latter is the DEFAULT series
# spectrum). Without this they are absent from a built wheel and both raise
# FileNotFoundError, which an editable install hides completely.
[tool.setuptools.package-data]
"helix.tpc" = ["data/*.json", "data/*.npz"]
# optical single-photon responses (helix.optical.codec.load_templates).
"helix.optical" = ["data/*.npz"]
# The bin-grid fingerprint. helix.data.bins.check_reference reads it to tell a
# freshly derived grid from the one the released models were trained against —
# the only check available to a site that arrived WITHOUT a copy of the original
# grid. Absent from a wheel, that check silently degrades to "no-reference".
"helix.data" = ["data/*.json"]
# Site profiles. Without this a wheel has no helix/sites/ at all and every root
# resolves to "unset" -- helix.paths.available_sites() returns [] and says so.
"helix" = ["sites/*.yaml"]

[tool.uv.sources]
# pimm-data is not on PyPI, so the `pimm` extra needs an explicit source. Pinned
# by REVISION rather than by branch, for the same reason pimm's own coeff-fm
# branch pins it: an unpinned git dependency follows whatever the default branch
# happens to be, and `uv lock` records the result in a file nobody reads. It had
# already settled on a revision predating the boundary move, which still defined
# AddNoise/Digitize -- transforms helix then registered too -- and that pair raised
# KeyError on the second registration.
#
# THIS REVISION IS LOCKSTEP WITH helix. It must equal PIMM_DATA_REV in
# container/helix-train.def; tests/test_lockstep_pin.py asserts that.
pimm-data = { git = "https://github.com/OmarAlterkait/pimm-data", rev = "2b20573ca14f1d06bcc40df8ee8c4e38b13fd94a" }
