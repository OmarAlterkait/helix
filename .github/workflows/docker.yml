name: Docker

# Build the helix image, prove it works, publish it by digest.
#
# Why this exists. The image is half of a LOCKSTEP pair: it bakes pimm-data by
# pinned revision, so it must be rebuilt whenever that revision moves. Rebuilding
# was an eleven-minute manual apptainer job on a cluster node, and the result was
# copied to a shared path by hand. That produced exactly what you would expect --
# three differently-named .sif files, the canonical one built months earlier from
# a local path source with CPU jax, while helix.paths and five documents all
# pointed at it.
#
# The cluster then pulls a tested image instead of building one:
#
#     apptainer pull helix-train.sif docker://ghcr.io/omaralterkait/helix@sha256:<digest>
#
# Pin the DIGEST. Tags are mutable rolling aliases and "whatever :main points at"
# is the ambiguity this replaces.

on:
  push:
    branches: [main]
    tags: ['v*']
    # only spend a 9 GB build when something that changes the image changed
    paths:
      - 'container/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'container/**'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      jax_extra:
        description: jax variant to build
        required: true
        default: cuda12
        type: choice
        options: [cuda12, cpu]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same owner as this repository, deliberately: GITHUB_TOKEN carries
  # packages:write for the repo owner's namespace and nothing else, so publishing
  # here needs no PAT and no secret to arrange. Moving the image under an
  # organisation later is a namespace change and a rebuild -- the image is built
  # from source, so nothing has to be migrated.
  IMAGE: ghcr.io/omaralterkait/helix
  CACHE_IMAGE: ghcr.io/omaralterkait/helix-buildcache:main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      pushed: ${{ steps.push.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # torch+CUDA+jax is far larger than a default runner's free space. The
      # preinstalled toolchains are worth ~25 GB and helix needs none of them.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      # A pull request from a fork gets a read-only GITHUB_TOKEN, so it builds
      # and tests without publishing. Everything else publishes.
      - name: Decide whether we publish
        id: push
        run: echo "enabled=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=jax-${{ github.event.inputs.jax_extra || 'cuda12' }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAX_EXTRA=${{ github.event.inputs.jax_extra || 'cuda12' }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: ${{ steps.push.outputs.enabled == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE_IMAGE) || '' }}
          provenance: false
          sbom: false
          # load into the daemon when not pushing, so the test job below can run it
          load: ${{ steps.push.outputs.enabled != 'true' }}
          push: ${{ steps.push.outputs.enabled == 'true' }}

      - name: Report what to pull
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "apptainer pull helix-train.sif docker://${IMAGE}@${{ steps.build.outputs.digest }}"

  # The image is only useful if helix runs in it. The suite needs no GPU and no
  # production data -- the data-dependent tests skip themselves.
  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Log in to GHCR
        if: needs.build.outputs.pushed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By DIGEST, not tag: this must test the build that just happened, and a
      # tag is a mutable alias that another run can move underneath it.
      - name: Run the suite inside the image
        if: needs.build.outputs.pushed == 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          docker pull "$REF"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e PYTHONNOUSERSITE=1 -e PYTHONPATH=/work -e HELIX_ROOT=/work \
            "$REF" /opt/pimm/.venv/bin/python -m pytest tests -q

  # The step that actually proves a handover works: corpus -> verify -> holdout
  # -> bins -> train, on a synthetic dataset, with no production data at all.
  # docs/RUNBOOK.md 0b is this procedure; keeping it in CI means the first thing
  # a receiving site does is the thing that is continuously tested.
  #
  # dump_probe_truth is deliberately NOT here: the fixture is schema-conformant,
  # not physics-conformant, so its coverage guard correctly refuses. See 0b.
  smoke:
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The whole path, with no data
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          docker pull "$REF"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e PYTHONNOUSERSITE=1 -e PYTHONPATH=/work -e HELIX_ROOT=/work \
            "$REF" bash -euxo pipefail -c '
              PY=/opt/pimm/.venv/bin/python
              W=/tmp/smoke
              $PY -c "from pimm_data.testing import make_jaxtpc_sample; \
                      make_jaxtpc_sample(\"$W/sim\", dataset_name=\"sim_wire\", \
                                         n_events=200, readout_type=\"wire\")"
              $PY scripts/build_coeff_corpus.py \
                  --shard $W/sim/sensor/sim_wire_sensor_0000.h5 \
                  --out $W/corpus/run_synth --dataset-name sim_wire \
                  --mode serial --backend torch
              $PY -m helix.data.coeff_verify $W/corpus/run_synth --dataset-name sim_wire
              # 95/3/2 is tuned for 158k events; over 100 the 2% part can
              # legitimately select ZERO and write_holdout refuses, correctly.
              $PY scripts/write_holdout.py --corpus $W/corpus/run_synth \
                  --dataset-name sim_wire --train 0.6 --val 0.2 --probe 0.2
              $PY scripts/derive_coeff_bins.py --corpus $W/corpus/run_synth \
                  --dataset-name sim_wire --out $W/bins.pt --events 100 --K 128
              # loss must DECREASE from about ln(128) = 4.85, where an untrained
              # categorical head starts
              $PY scripts/smoke_train_fm.py --corpus $W/corpus/run_synth \
                  --bins-from $W/bins.pt --events 4 --steps 8
            '
