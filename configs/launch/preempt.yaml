# The default: a chain of preemptible batch jobs that resume from the last
# checkpoint (submitit requeue). The site profile's time_min (2 h at NERSC) is
# the guaranteed floor; 24 h is the ceiling. Nodes come from the command line:
#   scripts/submit.sh fm --resources.nnodes 4
_base_: [_common.yaml]
resources:
  time: "24:00:00"
  nnodes: 1
  nproc_per_node: 4
  # A link held by --dependency (scripts/sweep.py's `then` stage) whose predecessor failed is
  # cancelled, not left pending forever: NERSC's slurm.conf sets no kill_invalid_depend.
  # sbatch only (salloc has no such flag), hence here and not in _common.yaml.
  scheduler_options:
    kill-on-invalid-dep: "yes"
chain:
  jobs: 8
