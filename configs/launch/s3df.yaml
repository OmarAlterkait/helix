# Training at S3DF: one node of 4 A100s, chained.
#
#   scripts/train.sh fm --chain.jobs 8
#
# The account, partition and QOS come from helix/sites/s3df.yaml (scheduler.train) through
# scripts/train.sh. That QOS is a non-preemptable one on purpose: S3DF's preemptable QOS
# CANCELS a preempted job (PreemptMode=CANCEL), and a chain here is submitit's
# timeout/requeue, which only continues a job that times out.
_base_: [_common.yaml]

resources:
  time: "24:00:00"
  nnodes: 1
  nproc_per_node: 4
  cpus_per_proc: 8
  mem: 200G

chain:
  jobs: 4
