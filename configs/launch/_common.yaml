# What every helix launch recipe shares. Recipes are pimm launch YAML
# (`pimm submit --recipe`); scripts/submit.sh is the one way they are used.
#
# Nothing here names a path, an account or an image: launch YAML cannot read
# the environment (its {placeholders} resolve against the launch config only,
# and `env:` values are shell-quoted), so site facts reach pimm as CLI flags
# from scripts/submit.sh, which reads them from helix/sites/<site>.yaml.
#
# helix and pimm reach the job on PYTHONPATH, which scripts/submit.sh exports with HELIX_ROOT and
# every HELIX_* root: a batch job inherits the submitting environment (sbatch), and so does an
# interactive chain (pimm's scron driver restores it from <run>/submitit/watchdog/env.sh). pimm's
# code snapshot copies only its own scripts/ tools/ pimm/, and train.sh prepends it to PYTHONPATH,
# keeping the rest, so every link of a chain imports helix. No `setup:` here: a recipe's list
# replaces the site's, and pimm's nersc-container `setup:` puts the image's parallel HDF5
# (/opt/hdf5/lib) on LD_LIBRARY_PATH.
#
# The NCCL flight recorder: on a collective timeout every rank dumps its last 2000 NCCL calls,
# which names the rank that stopped (the StepWatchdog hook dumps that rank's Python stacks first).
env:
  TORCH_NCCL_DUMP_ON_TIMEOUT: "1"
  TORCH_NCCL_TRACE_BUFFER_SIZE: "2000"
# The whole node to the training step: CPUs on all four NUMA nodes and all of its memory. pimm's
# NERSC site default (cpus_per_proc 6 x 4 = 24 CPUs, mem 192G) puts the step on NUMA node 0 alone
# (63 GB), where 4 ranks + their DataLoader workers overflowed it: the kernel then evicted the
# container's code pages, refaulted them through one single-threaded squashfs decompressor, and
# froze the job for minutes -- the denoiser "hangs" (2026-11-10, docs/STATUS.md; hang_diag/). The
# nodes are exclusive, so this costs nothing; measured 0.374 vs 0.51 s/step. `mem: "0"` is Slurm's
# "all the node's memory" (a string: pimm skips a falsy 0).
resources:
  cpus_per_proc: 32
  mem: "0"
run:
  timestamp: false            # the run dir is $HELIX_EXP/<name>, which other configs name (fm_cooldown, denoise)
chain:
  wandb_mode: fork
