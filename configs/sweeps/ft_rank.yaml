# Does a short, fixed-budget fine-tune rank PRETRAININGS? The candidate replacement for the frozen
# probe's primary key: an MAE is pretrained to be fine-tuned, and frozen probes of MAE features
# are known to understate them (r1: the fine-tuned denoiser 0.56 near activity where the frozen
# probe did far worse). The r1 fast protocol -- 1,024 labelled events, ~4k steps x 4 events,
# seeds reproducing to +-0.002 -- separated pretrained from scratch by +0.1-0.2; it never compared
# two pretrainings. So it is validated here on pairs whose frozen-probe order is known:
#   cool        fm_cooldown (S3DF), its `last` (the cooldown's weight)
#   stable      fm (S3DF stable phase), its EMA -- frozen probe: cool better by +0.045 clear
#   lr44s1      lr4.4e-3_s1_cool (NERSC), `last` -- frozen probe: = cool (-0.005 [-0.011, +0.003])
#   lr44s0      lr4.4e-3_cool, the same recipe's other TRAINING seed -- frozen probe: -0.044 below
#               lr44s1 [-0.051, -0.038], as large as any LR difference in d1m_lr. Does the
#               fine-tune see that training-seed gap, or is it invisible downstream?
#   scratch     the same architecture from random init: the floor
# Two seeds each (the second seed's spread is the resolution). Denoiser held fixed: point charge
# head, conditional charge, no linear-amplitude input (the pretraining is what varies).
# Scored with helix.eval --metrics denoise against fm_cooldown's tokenizer and events (shared by
# every arm: one tokenizer config, one identity-hash holdout).
#
#   python scripts/sweep.py configs/sweeps/ft_rank.yaml --dry-run
config: denoise
submit: [--resources.nnodes, "1"]
overrides:
  data.train.n_events: 1024
  epoch: 16
  model.cond_charge: true
  model.dist: point
  model.lin_amp_scale: 0.0
arms:
  ft_cool:       {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm_cooldown/model/last}}
  ft_cool_s1:    {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm_cooldown/model/last, seed: 1}}
  ft_stable:     {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm}}
  ft_stable_s1:  {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm, seed: 1}}
  ft_lr44s1:     {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp/helix/lr4.4e-3_s1_cool/model/last}}
  ft_lr44s1_s1:  {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp/helix/lr4.4e-3_s1_cool/model/last, seed: 1}}
  ft_lr44s0:     {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp/helix/lr4.4e-3_cool/model/last}}
  ft_lr44s0_s1:  {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp/helix/lr4.4e-3_cool/model/last, seed: 1}}
  ft_scratch:    {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm_cooldown/model/last, model.pretrained: false}}
  ft_scratch_s1: {overrides: {model.fm: /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm_cooldown/model/last, model.pretrained: false, seed: 1}}
after_each:
  command: python -m helix.eval /global/cfs/cdirs/m5238/users/oalter/exp_s3df/fm_cooldown --weights last --metrics denoise --denoiser $HELIX_EXP/{run} --out $HELIX_EXP/{run}/eval_denoise.json
  time: "04:00:00"
