# The recipe's learning rate on d1m, before any long run (TODO: "Confirm the LR at production
# length"). fm.py's 4.4e-3 * sqrt(GPUs / 16) was tuned on r1 at 29.2k steps; the optimum falls
# with run length, so three peak LRs at 16 GPUs -- 4.4e-3 (the recipe), 3.1e-3, 2.2e-3 (the B = 4
# equivalents 2.2e-3, 1.55e-3, 1.1e-3) -- for 3 epochs of j000000 (~36k steps), each cooled, plus a
# second seed of the recipe's LR: the noise floor every difference is read against (r1 d768:
# ~0.02 loss, 0.03-0.04 floor efficiency). Judged by the probes, not the loss (rank correlation
# 0.15 between them over 17 r1 models): the along-wire probe (`helix.eval --uprobe`), and the
# ft_eval fine-tune of an encoder (configs/sweeps/ft_eval.yaml).
#
#   python scripts/sweep.py configs/sweeps/d1m_lr.yaml --dry-run
#
# Cooldown length (TODO C6): on a one-run corpus fm_cooldown's COOLDOWN_RUNS is a whole epoch of
# j000000 (a third of the stable phase); max_len caps it at 57,600 events = 3.6k steps at 16 GPUs,
# 10% of the stable phase. A file-order prefix, as C6 warns, but the same one for every arm.
config: fm
submit: [--resources.nnodes, "4"]
arms:
  lr4.4e-3:    {overrides: {optimizer.lr: 4.4e-3}}
  lr4.4e-3_s1: {overrides: {optimizer.lr: 4.4e-3, seed: 1}}
  lr3.1e-3:    {overrides: {optimizer.lr: 3.1e-3}}
  lr2.2e-3:    {overrides: {optimizer.lr: 2.2e-3}}
then:
  config: fm_cooldown
  suffix: _cool
  submit: [--resources.nnodes, "4", --chain.jobs, "2"]
  overrides: {weight: "$HELIX_EXP/{run}/model/last", data.train.max_len: 57600}
after_each:
  command: python -m helix.eval --uprobe $HELIX_EXP/{run} --weights last --out $HELIX_EXP/{run}/eval.json
  time: "04:00:00"
